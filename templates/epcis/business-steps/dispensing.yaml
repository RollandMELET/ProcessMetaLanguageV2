# Description: Business step EPCIS 2.0 - Dispensing (Distribution/dispensation)

business_step_id: "dispensing"
business_step_name: "Dispensing"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of distributing objects to end users or specific recipients according to prescribed requirements"
  fr: "Action de distribution d'objets aux utilisateurs finaux ou destinataires spécifiques selon exigences prescrites"

category: "retail"
typical_objects:
  - "pharmaceutical"
  - "medical-device"
  - "controlled-substance"
  - "prescription-drug"
  - "chemical"

common_dispositions:
  before: ["active", "available", "verified"]
  after: ["dispensed", "consumed", "distributed"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#4CAF50"
  icon: "💊"
  workflow_position: "exit"

api_generation:
  endpoint: "/api/dispensing"
  method: "POST"
  required_params: ["object_id", "recipient", "quantity", "dispenser"]
  optional_params: ["prescription_id", "dosage", "instructions", "expiry_date"]

examples:
  - scenario: "Pharmacy medication dispensing"
    before_state: "available"
    after_state: "dispensed"
    description: "Prescription medication dispensed to patient"
  - scenario: "Hospital controlled substance distribution"
    before_state: "verified"
    after_state: "distributed"
    description: "Pain medication dispensed to hospital ward"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:35:00Z"
updated_at: "2025-07-28T12:35:00Z"

# <!-- END OF FILE: dispensing.yaml -->