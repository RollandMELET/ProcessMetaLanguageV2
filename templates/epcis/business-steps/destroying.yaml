# Description: Business step EPCIS 2.0 - Destroying (Destruction)

business_step_id: "destroying"
business_step_name: "Destroying"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of permanently eliminating objects through controlled destruction processes"
  fr: "Action d'élimination permanente d'objets via processus de destruction contrôlés"

category: "manufacturing"
typical_objects:
  - "expired-product"
  - "defective-product"
  - "recalled-product"
  - "hazardous-material"
  - "confidential-document"

common_dispositions:
  before: ["expired", "recalled", "contaminated", "defective"]
  after: ["destroyed", "disposed"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#FF9800"
  icon: "🗑️"
  workflow_position: "exit"

api_generation:
  endpoint: "/api/destroying"
  method: "POST"
  required_params: ["object_id", "destruction_method", "operator", "reason"]
  optional_params: ["certificate", "witness", "environmental_compliance", "cost"]

examples:
  - scenario: "Expired pharmaceutical destruction"
    before_state: "expired"
    after_state: "destroyed"
    description: "Controlled incineration of expired medications"
  - scenario: "Recalled product destruction"
    before_state: "recalled"
    after_state: "disposed"
    description: "Defective automotive parts destroyed per safety protocol"

epcis_event_type: "ObjectEvent"
epcis_action: "DELETE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:15:00Z"
updated_at: "2025-07-28T12:15:00Z"

