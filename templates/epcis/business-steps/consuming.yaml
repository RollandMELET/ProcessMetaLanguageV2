# Description: Business step EPCIS 2.0 - Consuming (Consommation)

business_step_id: "consuming"
business_step_name: "Consuming"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of using up or depleting objects through consumption or utilization by end users"
  fr: "Action d'épuisement ou déplétion d'objets via consommation ou utilisation par utilisateurs finaux"

category: "retail"
typical_objects:
  - "consumable-product"
  - "food-product"
  - "pharmaceutical"
  - "fuel"
  - "raw-material"

common_dispositions:
  before: ["dispensed", "active", "available"]
  after: ["consumed", "depleted", "used"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#4CAF50"
  icon: "🍽️"
  workflow_position: "exit"

api_generation:
  endpoint: "/api/consuming"
  method: "POST"
  required_params: ["object_id", "consumer", "quantity_consumed", "consumption_date"]
  optional_params: ["remaining_quantity", "consumption_rate", "location", "purpose"]

examples:
  - scenario: "Patient medication consumption"
    before_state: "dispensed"
    after_state: "consumed"
    description: "Daily dose of prescribed medication taken by patient"
  - scenario: "Manufacturing raw material usage"
    before_state: "active"
    after_state: "depleted"
    description: "Steel ingots consumed in production process"

epcis_event_type: "ObjectEvent"
epcis_action: "DELETE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:35:00Z"
updated_at: "2025-07-28T12:35:00Z"

# <!-- END OF FILE: consuming.yaml -->