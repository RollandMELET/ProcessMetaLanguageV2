# Description: Business step EPCIS 2.0 - Transporting (Transport)

business_step_id: "transporting"
business_step_name: "Transporting"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of moving objects from one location to another during transit"
  fr: "Action de déplacement d'objets d'un lieu vers un autre pendant le transit"

category: "logistics"
typical_objects:
  - "shipment"
  - "container"
  - "pallet"
  - "finished-product"
  - "raw-material"

common_dispositions:
  before: ["in_transit"]
  after: ["in_transit"]

processmetalanguage_mapping:
  action_type: "primary"
  color_code: "#2196F3"
  icon: "🚚"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/transporting"
  method: "POST"
  required_params: ["object_id", "current_location", "carrier", "vehicle_id"]
  optional_params: ["gps_coordinates", "temperature", "humidity", "estimated_arrival"]

examples:
  - scenario: "Goods in transit checkpoint"
    before_state: "in_transit"
    after_state: "in_transit"
    description: "Tracking update during highway transport"
  - scenario: "Cross-dock transfer point"
    before_state: "in_transit"
    after_state: "in_transit"
    description: "Goods transferred between transport vehicles"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["location"]
  destination_types: ["location"]
  
created_at: "2025-07-28T12:00:00Z"
updated_at: "2025-07-28T12:00:00Z"

