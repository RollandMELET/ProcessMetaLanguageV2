# Description: Business step EPCIS 2.0 - Assembling (Assemblage/montage)

business_step_id: "assembling"
business_step_name: "Assembling"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of combining multiple components or parts to create a more complex product or assembly"
  fr: "Action de combinaison de multiples composants ou pièces pour créer un produit ou assemblage plus complexe"

category: "manufacturing"
typical_objects:
  - "component"
  - "sub-assembly"
  - "finished-product"
  - "work-in-progress"
  - "kit"

common_dispositions:
  before: ["active", "in_progress"]
  after: ["in_progress", "completed"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#FF9800"
  icon: "🔧"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/assembling"
  method: "POST"
  required_params: ["parent_object", "child_objects", "assembly_type", "operator"]
  optional_params: ["tools_used", "assembly_time", "quality_check", "serial_number"]

examples:
  - scenario: "Electronic device assembly"
    before_state: "active"
    after_state: "in_progress"
    description: "PCB, casing, and components assembled into smartphone"
  - scenario: "Automotive engine assembly"
    before_state: "in_progress"
    after_state: "completed"
    description: "Engine block, pistons, and valves assembled into complete engine"

epcis_event_type: "AggregationEvent"
epcis_action: "ADD"

validation:
  mandatory_fields: ["parentID", "childEPCs", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["location", "possessing_party"]
  destination_types: ["location", "possessing_party"]
  
created_at: "2025-07-28T12:10:00Z"
updated_at: "2025-07-28T12:10:00Z"

