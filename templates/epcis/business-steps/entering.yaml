# Description: Business step EPCIS 2.0 - Entering (Entrée)

business_step_id: "entering"
business_step_name: "Entering"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of objects crossing into a defined area, zone, or location boundary"
  fr: "Action d'objets franchissant dans une zone, aire ou limite de lieu défini"

category: "logistics"
typical_objects:
  - "tracked-vehicle"
  - "container"
  - "pallet"
  - "shipment"
  - "asset"

common_dispositions:
  before: ["in_transit", "approaching"]
  after: ["entered", "present", "inside"]

processmetalanguage_mapping:
  action_type: "primary"
  color_code: "#2196F3"
  icon: "🚪"
  workflow_position: "control"

api_generation:
  endpoint: "/api/entering"
  method: "POST"
  required_params: ["object_id", "location_id", "entry_point", "timestamp"]
  optional_params: ["authorization", "purpose", "expected_duration", "gate_operator"]

examples:
  - scenario: "Vehicle entering facility gate"
    before_state: "in_transit"
    after_state: "entered"
    description: "Delivery truck enters manufacturing facility premises"
  - scenario: "Container entering port zone"
    before_state: "approaching"
    after_state: "inside"
    description: "Shipping container enters restricted port area"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["location"]
  destination_types: ["location"]
  
created_at: "2025-07-28T12:30:00Z"
updated_at: "2025-07-28T12:30:00Z"

# <!-- END OF FILE: entering.yaml -->