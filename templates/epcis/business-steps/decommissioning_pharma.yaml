# Description: Business step EPCIS 2.0 - Decommissioning Pharma (Hors service pharma)

business_step_id: "decommissioning_pharma"
business_step_name: "Decommissioning Pharma"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The specialized act of taking pharmaceutical products out of active service due to regulatory, safety, or lifecycle reasons"
  fr: "Action spécialisée de mise hors service de produits pharmaceutiques pour raisons réglementaires, sécurité ou cycle de vie"

category: "pharmaceutical"
typical_objects:
  - "recalled-drug"
  - "expired-pharmaceutical"
  - "discontinued-product"
  - "unsafe-medical-device"
  - "withdrawn-vaccine"

common_dispositions:
  before: ["recalled", "expired", "unsafe"]
  after: ["decommissioned", "withdrawn", "quarantined"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#9C27B0"
  icon: "⛔"
  workflow_position: "exit"

api_generation:
  endpoint: "/api/decommissioning-pharma"
  method: "POST"
  required_params: ["object_id", "decommissioning_reason", "regulatory_authority", "effective_date"]
  optional_params: ["recall_class", "patient_notification", "return_instructions", "disposal_method"]

examples:
  - scenario: "Drug product recall decommissioning"
    before_state: "recalled"
    after_state: "decommissioned"
    description: "Contaminated batch withdrawn from market per FDA Class I recall"
  - scenario: "Expired vaccine decommissioning"
    before_state: "expired"
    after_state: "quarantined"
    description: "COVID vaccine lots decommissioned due to expiration"

epcis_event_type: "ObjectEvent"
epcis_action: "DELETE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:40:00Z"
updated_at: "2025-07-28T12:40:00Z"

