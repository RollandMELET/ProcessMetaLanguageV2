# Description: Business step EPCIS 2.0 - Accepting (Acceptation)

business_step_id: "accepting"
business_step_name: "Accepting"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of approving objects after inspection or verification, indicating they meet required standards"
  fr: "Action d'approbation d'objets après inspection ou vérification, indiquant qu'ils répondent aux standards requis"

category: "manufacturing"
typical_objects:
  - "raw-material"
  - "finished-product"
  - "component"
  - "work-in-progress"
  - "batch"

common_dispositions:
  before: ["needs_inspection", "pending"]
  after: ["accepted", "active"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#FF9800"
  icon: "✅"
  workflow_position: "control"

api_generation:
  endpoint: "/api/accepting"
  method: "POST"
  required_params: ["object_id", "inspector", "acceptance_criteria", "decision"]
  optional_params: ["certificate", "test_report", "expiry_date", "notes"]

examples:
  - scenario: "Raw material acceptance after quality control"
    before_state: "needs_inspection"
    after_state: "accepted"
    description: "Steel batch accepted for production use"
  - scenario: "Finished product release approval"
    before_state: "pending"
    after_state: "active"
    description: "Medical device approved for market release"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:15:00Z"
updated_at: "2025-07-28T12:15:00Z"

