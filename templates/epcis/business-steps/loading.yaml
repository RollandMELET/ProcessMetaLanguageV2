# Description: Business step EPCIS 2.0 - Loading (Chargement)

business_step_id: "loading"
business_step_name: "Loading"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of placing objects onto transport vehicles, containers, or carriers for movement"
  fr: "Action de placement d'objets sur véhicules de transport, conteneurs ou porteurs pour déplacement"

category: "logistics"
typical_objects:
  - "pallet"
  - "container"
  - "package"
  - "finished-product"
  - "shipment"

common_dispositions:
  before: ["ready_for_shipment", "picked"]
  after: ["loaded", "in_transit"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#2196F3"
  icon: "🚛"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/loading"
  method: "POST"
  required_params: ["object_id", "vehicle_id", "loader", "loading_location"]
  optional_params: ["load_sequence", "weight", "securing_method", "manifest"]

examples:
  - scenario: "Truck loading at dock"
    before_state: "ready_for_shipment"
    after_state: "loaded"
    description: "Pallets loaded onto delivery truck for customer shipment"
  - scenario: "Container loading at port"
    before_state: "picked"
    after_state: "in_transit"
    description: "Export goods loaded into shipping container"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["location"]
  destination_types: ["location"]
  
created_at: "2025-07-28T12:30:00Z"
updated_at: "2025-07-28T12:30:00Z"

# <!-- END OF FILE: loading.yaml -->