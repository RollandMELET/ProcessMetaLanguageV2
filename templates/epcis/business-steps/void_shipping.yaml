# Description: Business step EPCIS 2.0 - Void Shipping (Annulation expédition)

business_step_id: "void_shipping"
business_step_name: "Void Shipping"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of canceling or voiding a previously initiated shipping transaction or process"
  fr: "Action d'annulation ou annulation d'une transaction ou processus d'expédition précédemment initié"

category: "logistics"
typical_objects:
  - "shipment"
  - "package"
  - "container"
  - "order"
  - "manifest"

common_dispositions:
  before: ["shipped", "in_transit", "ready_for_shipment"]
  after: ["voided", "canceled", "returned_to_stock"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#F44336"
  icon: "❌"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/void-shipping"
  method: "POST"
  required_params: ["shipment_id", "void_reason", "operator", "void_date"]
  optional_params: ["customer_notification", "refund_required", "restocking_fee", "carrier_notification"]

examples:
  - scenario: "Customer order cancellation"
    before_state: "ready_for_shipment"
    after_state: "voided"
    description: "Customer cancels order before shipment, returning items to stock"
  - scenario: "Shipping error correction"
    before_state: "shipped"
    after_state: "returned_to_stock"
    description: "Wrong address shipment voided and returned for correction"

epcis_event_type: "ObjectEvent"
epcis_action: "DELETE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:45:00Z"
updated_at: "2025-07-28T12:45:00Z"

# <!-- END OF FILE: void_shipping.yaml -->