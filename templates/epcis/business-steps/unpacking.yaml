# Description: Business step EPCIS 2.0 - Unpacking (Déballage/déconditionnement)

business_step_id: "unpacking"
business_step_name: "Unpacking"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of removing products from their containers, packages, or protective enclosures"
  fr: "Action de retrait de produits de leurs contenants, emballages ou enceintes protectrices"

category: "manufacturing"
typical_objects:
  - "package"
  - "case"
  - "pallet"
  - "finished-product"
  - "component"

common_dispositions:
  before: ["packed", "in_transit"]
  after: ["active", "available"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#FF9800"
  icon: "📂"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/unpacking"
  method: "POST"
  required_params: ["package_id", "extracted_products", "operator"]
  optional_params: ["condition_assessment", "damage_report", "location"]

examples:
  - scenario: "Retail case unpacking"
    before_state: "packed"
    after_state: "active"
    description: "Cases unpacked for individual product stocking"
  - scenario: "Received shipment unpacking"
    before_state: "in_transit"
    after_state: "available"
    description: "Incoming shipment cases unpacked for inventory"

epcis_event_type: "AggregationEvent"
epcis_action: "DELETE"

validation:
  mandatory_fields: ["parentID", "childEPCs", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["location", "possessing_party"]
  destination_types: ["location", "possessing_party"]
  
created_at: "2025-07-28T12:10:00Z"
updated_at: "2025-07-28T12:10:00Z"

# <!-- END OF FILE: unpacking.yaml -->