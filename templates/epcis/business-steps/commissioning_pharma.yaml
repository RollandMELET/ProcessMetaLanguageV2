# Description: Business step EPCIS 2.0 - Commissioning Pharma (Mise service pharma)

business_step_id: "commissioning_pharma"
business_step_name: "Commissioning Pharma"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The specialized act of putting pharmaceutical products into active service with regulatory approval and verification"
  fr: "Action spécialisée de mise en service actif de produits pharmaceutiques avec approbation réglementaire et vérification"

category: "pharmaceutical"
typical_objects:
  - "prescription-drug"
  - "medical-device"
  - "pharmaceutical-equipment"
  - "vaccine"
  - "clinical-trial-drug"

common_dispositions:
  before: ["approved", "validated", "tested"]
  after: ["commissioned", "market_ready", "deployable"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#9C27B0"
  icon: "✅"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/commissioning-pharma"
  method: "POST"
  required_params: ["object_id", "regulatory_approval", "commissioning_authority", "market"]
  optional_params: ["fda_approval_number", "clinical_data", "safety_profile", "launch_date"]

examples:
  - scenario: "New drug market authorization"
    before_state: "approved"
    after_state: "commissioned"
    description: "FDA-approved drug commissioned for US market distribution"
  - scenario: "Medical device clinical deployment"
    before_state: "validated"
    after_state: "deployable"
    description: "Class III medical device commissioned for hospital use"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:40:00Z"
updated_at: "2025-07-28T12:40:00Z"

