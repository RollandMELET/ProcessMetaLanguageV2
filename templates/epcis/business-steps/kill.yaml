# Description: Business step EPCIS 2.0 - Kill (Désactivation définitive)

business_step_id: "kill"
business_step_name: "Kill"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of permanently disabling or deactivating an EPC tag or identifier, making it unreadable"
  fr: "Action de désactivation ou déactivation permanente d'une étiquette EPC ou identifiant, le rendant illisible"

category: "logistics"
typical_objects:
  - "epc-tag"
  - "rfid-tag"
  - "smart-label"
  - "electronic-identifier"
  - "tracking-device"

common_dispositions:
  before: ["active", "readable", "trackable"]
  after: ["killed", "disabled", "unreadable"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#F44336"
  icon: "⚠️"
  workflow_position: "exit"

api_generation:
  endpoint: "/api/kill"
  method: "POST"
  required_params: ["tag_id", "kill_password", "operator", "reason"]
  optional_params: ["final_read", "kill_verification", "disposal_plan", "privacy_compliance"]

examples:
  - scenario: "RFID tag deactivation at point of sale"
    before_state: "active"
    after_state: "killed"
    description: "Retail RFID tag permanently disabled after customer purchase"
  - scenario: "Privacy protection tag kill"
    before_state: "trackable"
    after_state: "unreadable"
    description: "Consumer product tag killed to protect customer privacy"

epcis_event_type: "ObjectEvent"
epcis_action: "DELETE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:45:00Z"
updated_at: "2025-07-28T12:45:00Z"

# <!-- END OF FILE: kill.yaml -->