# Description: Business step EPCIS 2.0 - Encoding Pharma (Encodage pharmaceutique)

business_step_id: "encoding_pharma"
business_step_name: "Encoding Pharma"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The specialized act of applying pharmaceutical-grade identification and serialization codes to drug products"
  fr: "Action spécialisée d'application de codes d'identification et sérialisation de grade pharmaceutique aux produits médicamenteux"

category: "pharmaceutical"
typical_objects:
  - "prescription-drug"
  - "vaccine"
  - "biological-product"
  - "medical-device"
  - "pharmaceutical-package"

common_dispositions:
  before: ["manufactured", "tested"]
  after: ["serialized", "encoded", "trackable"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#9C27B0"
  icon: "🏷️"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/encoding-pharma"
  method: "POST"
  required_params: ["object_id", "serial_number", "lot_number", "expiry_date"]
  optional_params: ["ndc_number", "gtin", "verification_code", "regulatory_info"]

examples:
  - scenario: "Drug product serialization"
    before_state: "manufactured"
    after_state: "serialized"
    description: "Prescription bottle encoded with unique serial number per FDA requirements"
  - scenario: "Vaccine vial encoding"
    before_state: "tested"
    after_state: "trackable"
    description: "COVID vaccine vial encoded with lot and expiry for cold chain tracking"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:40:00Z"
updated_at: "2025-07-28T12:40:00Z"

# <!-- END OF FILE: encoding_pharma.yaml -->