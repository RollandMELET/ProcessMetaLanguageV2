# Description: Business step EPCIS 2.0 - Replacing (Remplacement)

business_step_id: "replacing"
business_step_name: "Replacing"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of substituting one object with another, typically due to defects, expiration, or upgrades"
  fr: "Action de substitution d'un objet par un autre, typiquement due à défauts, expiration ou améliorations"

category: "manufacturing"
typical_objects:
  - "component"
  - "defective-product"
  - "expired-product"
  - "equipment"
  - "part"

common_dispositions:
  before: ["defective", "expired", "damaged"]
  after: ["replaced", "active", "disposed"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#FF9800"
  icon: "🔄"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/replacing"
  method: "POST"
  required_params: ["old_object_id", "new_object_id", "replacement_reason", "technician"]
  optional_params: ["cost", "warranty_transfer", "disposal_method", "upgrade_notes"]

examples:
  - scenario: "Defective component replacement"
    before_state: "defective"
    after_state: "replaced"
    description: "Faulty CPU replaced with new unit in server"
  - scenario: "Expired pharmaceutical replacement"
    before_state: "expired"
    after_state: "disposed"
    description: "Expired medication replaced with fresh stock"

epcis_event_type: "ObjectEvent"
epcis_action: "DELETE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:15:00Z"
updated_at: "2025-07-28T12:15:00Z"

# <!-- END OF FILE: replacing.yaml -->