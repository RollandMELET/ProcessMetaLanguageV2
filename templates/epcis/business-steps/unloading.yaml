# Description: Business step EPCIS 2.0 - Unloading (Déchargement)

business_step_id: "unloading"
business_step_name: "Unloading"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of removing objects from transport vehicles, containers, or carriers after movement"
  fr: "Action de retrait d'objets des véhicules de transport, conteneurs ou porteurs après déplacement"

category: "logistics"
typical_objects:
  - "pallet"
  - "container"
  - "package"
  - "finished-product"
  - "shipment"

common_dispositions:
  before: ["loaded", "in_transit"]
  after: ["unloaded", "received", "available"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#2196F3"
  icon: "📦"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/unloading"
  method: "POST"  
  required_params: ["object_id", "vehicle_id", "unloader", "unloading_location"]
  optional_params: ["condition_check", "damage_report", "receiving_signature", "manifest_verification"]

examples:
  - scenario: "Delivery truck unloading"
    before_state: "loaded"
    after_state: "unloaded"
    description: "Customer order pallets unloaded at retail store dock"
  - scenario: "Container unloading at port"
    before_state: "in_transit"
    after_state: "received"
    description: "Import goods unloaded from shipping container"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["location"]
  destination_types: ["location"]
  
created_at: "2025-07-28T12:30:00Z"
updated_at: "2025-07-28T12:30:00Z"

# <!-- END OF FILE: unloading.yaml -->