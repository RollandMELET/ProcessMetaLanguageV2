# FILENAME: receiving.yaml
# Version: 1.0.0
# Date: 2025-07-28 12:00
# Author: Rolland MELET & Claude Code
# Description: Business step EPCIS 2.0 - Receiving (Réception de marchandises)

business_step_id: "receiving"
business_step_name: "Receiving"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of receiving goods from a supplier or external party into inventory or custody"
  fr: "Action de réception de marchandises d'un fournisseur ou tiers externe en inventaire ou garde"

category: "logistics"
typical_objects:
  - "raw-material"
  - "finished-product" 
  - "packaging"
  - "component"
  - "lot-batch"

common_dispositions:
  before: ["in_transit", "unknown"]
  after: ["active", "in_progress", "needs_inspection"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#2196F3"
  icon: "📦"
  workflow_position: "entry"

api_generation:
  endpoint: "/api/receiving"
  method: "POST"
  required_params: ["object_id", "from_party", "quantity"]
  optional_params: ["temperature", "batch_number", "expiry_date"]

examples:
  - scenario: "Raw material reception from supplier"
    before_state: "in_transit"
    after_state: "active"
    description: "Steel coils received at manufacturing facility"
  - scenario: "Finished product return from customer"
    before_state: "unknown"
    after_state: "needs_inspection"
    description: "Product returned for quality control"

epcis_event_type: "ObjectEvent"
epcis_action: "ADD"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party", "owning_party"]
  destination_types: ["possessing_party", "owning_party"]
  
created_at: "2025-07-28T12:00:00Z"
updated_at: "2025-07-28T12:00:00Z"

# <!-- END OF FILE: receiving.yaml -->