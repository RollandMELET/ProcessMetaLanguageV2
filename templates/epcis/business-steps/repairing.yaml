# Description: Business step EPCIS 2.0 - Repairing (Réparation)

business_step_id: "repairing"
business_step_name: "Repairing"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of fixing damaged or defective objects to restore their functionality or condition"
  fr: "Action de réparation d'objets endommagés ou défectueux pour restaurer leur fonctionnalité ou condition"

category: "manufacturing"
typical_objects:
  - "defective-product"
  - "damaged-product"
  - "returned-product"
  - "equipment"
  - "component"

common_dispositions:
  before: ["damaged", "rejected", "needs_rework"]
  after: ["repaired", "active", "in_progress"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#FF9800"
  icon: "🔧"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/repairing"
  method: "POST"
  required_params: ["object_id", "technician", "repair_type", "parts_used"]
  optional_params: ["cost", "duration", "warranty", "before_after_photos"]

examples:
  - scenario: "Electronic device circuit repair"
    before_state: "damaged"
    after_state: "repaired"
    description: "Smartphone screen replacement and testing"
  - scenario: "Manufacturing equipment maintenance"
    before_state: "needs_rework"
    after_state: "active"
    description: "Production line conveyor belt repair"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:15:00Z"
updated_at: "2025-07-28T12:15:00Z"

# <!-- END OF FILE: repairing.yaml -->