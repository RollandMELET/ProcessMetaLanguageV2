# FILENAME: shipping.yaml
# Version: 1.0.0
# Date: 2025-07-28 12:00
# Author: Rolland MELET & Claude Code
# Description: Business step EPCIS 2.0 - Shipping (Expédition/envoi)

business_step_id: "shipping"
business_step_name: "Shipping"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of sending goods from one location to another, typically to customers or other facilities"
  fr: "Action d'envoi de marchandises d'un lieu vers un autre, typiquement vers clients ou autres installations"

category: "logistics"
typical_objects:
  - "finished-product"
  - "package"
  - "shipment"
  - "pallet"
  - "container"

common_dispositions:
  before: ["active", "reserved"]
  after: ["in_transit", "shipped"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#2196F3"
  icon: "🚛"
  workflow_position: "exit"

api_generation:
  endpoint: "/api/shipping"
  method: "POST"
  required_params: ["object_id", "to_party", "carrier", "tracking_number"]
  optional_params: ["delivery_date", "shipping_method", "insurance_value"]

examples:
  - scenario: "Product shipment to customer"
    before_state: "active"
    after_state: "in_transit"
    description: "Finished products shipped to retail store"
  - scenario: "Transfer between facilities"
    before_state: "reserved"
    after_state: "in_transit"
    description: "Raw materials transferred to production facility"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "sourceList", "destinationList", "quantityList"]

gs1_business_context:
  source_types: ["possessing_party", "owning_party"]
  destination_types: ["possessing_party", "owning_party"]
  
created_at: "2025-07-28T12:00:00Z"
updated_at: "2025-07-28T12:00:00Z"

# <!-- END OF FILE: shipping.yaml -->