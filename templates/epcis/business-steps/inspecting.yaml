# Description: Business step EPCIS 2.0 - Inspecting (Contrôle qualité/inspection)

business_step_id: "inspecting"
business_step_name: "Inspecting"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of examining objects to verify quality, condition, completeness, or compliance with specifications"
  fr: "Action d'examen d'objets pour vérifier qualité, condition, complétude ou conformité aux spécifications"

category: "manufacturing"
typical_objects:
  - "raw-material"
  - "finished-product"
  - "component"
  - "work-in-progress"
  - "returned-product"

common_dispositions:
  before: ["active", "needs_inspection", "in_progress"]
  after: ["accepted", "rejected", "needs_rework"]

processmetalanguage_mapping:
  action_type: "primary"
  color_code: "#FF9800"
  icon: "🔍"
  workflow_position: "control"

api_generation:
  endpoint: "/api/inspecting"
  method: "POST"
  required_params: ["object_id", "inspector", "inspection_type", "criteria"]
  optional_params: ["test_results", "defects", "comments", "photos"]

examples:
  - scenario: "Incoming raw material quality check"
    before_state: "needs_inspection"
    after_state: "accepted"
    description: "Steel quality verification against specifications"
  - scenario: "Final product quality control"
    before_state: "in_progress"
    after_state: "rejected"
    description: "Electronic device fails safety tests"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList", "destinationList"]

gs1_business_context:
  source_types: ["possessing_party"]
  destination_types: ["possessing_party"]
  
created_at: "2025-07-28T12:15:00Z"
updated_at: "2025-07-28T12:15:00Z"

# <!-- END OF FILE: inspecting.yaml -->