# FILENAME: storing.yaml
# Version: 1.0.0
# Date: 2025-07-28 12:00
# Author: Rolland MELET & Claude Code
# Description: Business step EPCIS 2.0 - Storing (Stockage/entreposage)

business_step_id: "storing"
business_step_name: "Storing"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "The act of placing objects in a storage location for preservation and future use"
  fr: "Action de placement d'objets en lieu de stockage pour préservation et usage futur"

category: "logistics"
typical_objects:
  - "raw-material"
  - "finished-product"
  - "component"
  - "work-in-progress"
  - "packaging"

common_dispositions:
  before: ["active", "in_progress"]
  after: ["stored", "reserved"]

processmetalanguage_mapping:
  action_type: "secondary"
  color_code: "#2196F3"
  icon: "🏪"
  workflow_position: "intermediate"

api_generation:
  endpoint: "/api/storing"
  method: "POST"
  required_params: ["object_id", "storage_location", "storage_type"]
  optional_params: ["temperature_range", "humidity_range", "expiry_date"]

examples:
  - scenario: "Raw material warehouse storage"
    before_state: "active"
    after_state: "stored"
    description: "Steel components stored in climate-controlled warehouse"
  - scenario: "Finished product inventory storage"
    before_state: "in_progress"
    after_state: "reserved"
    description: "Completed products awaiting shipment order"

epcis_event_type: "ObjectEvent"
epcis_action: "OBSERVE"

validation:
  mandatory_fields: ["epc", "bizStep", "disposition", "eventTime", "eventTimeZoneOffset", "readPoint"]
  optional_fields: ["bizLocation", "quantityList", "sourceList"]

gs1_business_context:
  source_types: ["location"]
  destination_types: ["location"]
  
created_at: "2025-07-28T12:00:00Z"
updated_at: "2025-07-28T12:00:00Z"

# <!-- END OF FILE: storing.yaml -->