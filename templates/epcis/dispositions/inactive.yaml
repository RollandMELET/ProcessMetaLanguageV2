# Description: Disposition EPCIS 2.0 "inactive" - Inactif/arrêté conforme CBV 2.0

disposition_id: "inactive"
disposition_name: "Inactive"
cbv_standard_version: "2.0"
epcis_standard_version: "2.0"
gs1_compliance: true

description:
  en: "Object is temporarily inactive or not currently in use but remains available"
  fr: "Objet temporairement inactif ou non utilisé actuellement mais reste disponible"

state_category: "operational"
state_type: "neutral"

processmetalanguage_mapping:
  state_color: "#757575" # Gris moyen
  banner_style: "dashed"
  priority: "low"
  visibility: "conditional"

compatible_business_steps:
  can_lead_to: ["storing", "inspecting", "commissioning", "activating"]
  can_result_from: ["decommissioning", "storing", "pausing_operation"]

workflow_transitions:
  typical_next_states: ["active", "stored", "inspecting"]
  prohibited_states: ["in_progress", "destroyed"]
  
quality_indicators:
  is_sellable: false
  is_usable: true
  requires_action: false
  
api_generation:
  state_endpoint: "/api/objects/{id}/state"
  valid_transitions: ["/api/transitions/inactive-to-active", "/api/transitions/inactive-to-stored"]

examples:
  - object_type: "production_equipment"
    scenario: "Équipement production en arrêt planifié"
    typical_duration: "maintenance_window"
  - object_type: "inventory_reserve"
    scenario: "Stock réserve non utilisé actuellement"
    typical_duration: "until_demand"
    
validation:
  state_constraints: ["must_have_inactive_reason", "must_be_monitored"]
  business_rules: ["inactive_items_require_periodic_check", "reactivation_procedure_defined"]
  
created_at: "2025-07-28T10:00:00.000Z"
updated_at: "2025-07-28T10:00:00.000Z"

# <!-- END OF FILE: inactive.yaml -->